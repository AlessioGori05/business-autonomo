# =====================================================================
#  METODI DI GUADAGNO testati in parallelo.
#  enabled: false  -> metodo spento
#  channels: su quali canali pubblica (vedi settings.yaml)
#  initial_share: quota iniziale dei caricamenti giornalieri del canale
#  variants: dimensioni da combinare per creare le varianti A1..A10
# =====================================================================

A_viral:
  name: "Shorts virali (curiosità e life hack)"
  enabled: true
  channels: [main_en, main_it]
  initial_share: 0.4
  topics:
    en: ["surprising science facts", "kitchen life hacks", "psychology tricks", "space facts",
         "history oddities", "animal superpowers", "money-saving habits", "cleaning hacks",
         "human body facts", "productivity tricks", "phone hidden features", "ocean mysteries"]
    it: ["curiosità scientifiche", "trucchi in cucina", "trucchi di psicologia", "curiosità sullo spazio",
         "stranezze della storia", "superpoteri degli animali", "abitudini per risparmiare", "trucchi per pulire",
         "curiosità sul corpo umano", "trucchi di produttività", "funzioni nascoste dello smartphone", "misteri dell'oceano"]
  variants:
    hook: ["question", "shocking_fact", "countdown", "you_are_doing_it_wrong", "mini_story"]
    theme: ["midnight", "sunset", "mint", "neon"]
    length: ["short", "long"]

